<!DOCTYPE html>
<html class="dark" lang="ca">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Herbari Digital Interactiu - Flora Balear</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="scripts.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="styles.css" rel="stylesheet" />
</head>

<body class="bg-background-dark font-display text-slate-300 transition-colors duration-200">
    <div class="relative flex min-h-screen w-full flex-col">
        <!-- Header (injectat per scripts.js) -->
        <div id="app-header"></div>
        <div class="flex flex-1">
            <!-- Sidebar Filtres (injectat per scripts.js) -->
            <div id="app-sidebar"></div>
            <!-- Main Content Area -->
            <main class="flex-1 p-6 lg:p-10 overflow-y-auto">
                <div class="max-w-6xl mx-auto">
                    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12">
                        <div>
                            <h2 class="text-3xl md:text-5xl font-black text-white mb-3 tracking-tight">Herbari de les
                                Illes Balears</h2>
                            <p class="text-slate-500 text-lg max-w-2xl">Explora la riquesa botànica única del nostre
                                arxipèlag mediterrani des d'una perspectiva científica i visual.</p>
                        </div>
                    </div>
                    <!-- Botanical Grid (injectat per scripts.js) -->
                    <div id="herbari-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-8">
                    </div>
                    <!-- Pagination -->
                    <div class="mt-16 flex items-center justify-center gap-2">
                        <button
                            class="w-12 h-12 flex items-center justify-center rounded-xl border border-white/10 text-slate-500 hover:border-primary-light hover:text-primary-light transition-all">
                            <span class="material-symbols-outlined">chevron_left</span>
                        </button>
                        <button
                            class="w-12 h-12 flex items-center justify-center rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/20">1</button>
                        <button
                            class="w-12 h-12 flex items-center justify-center rounded-xl border border-white/10 text-slate-500 hover:border-primary-light hover:text-primary-light transition-all">2</button>
                        <button
                            class="w-12 h-12 flex items-center justify-center rounded-xl border border-white/10 text-slate-500 hover:border-primary-light hover:text-primary-light transition-all">3</button>
                        <span class="px-2 text-slate-700">...</span>
                        <button
                            class="w-12 h-12 flex items-center justify-center rounded-xl border border-white/10 text-slate-500 hover:border-primary-light hover:text-primary-light transition-all">12</button>
                        <button
                            class="w-12 h-12 flex items-center justify-center rounded-xl border border-white/10 text-slate-500 hover:border-primary-light hover:text-primary-light transition-all">
                            <span class="material-symbols-outlined">chevron_right</span>
                        </button>
                    </div>
                </div>
            </main>
        </div>
        <!-- Footer (injectat per scripts.js) -->
        <div id="app-footer"></div>
        <!-- Floating Action Button for Mobile -->
        <button
            class="lg:hidden fixed bottom-20 right-6 h-16 w-16 rounded-full bg-primary text-white shadow-2xl flex items-center justify-center z-50 border border-white/10">
            <span class="material-symbols-outlined text-3xl">filter_list</span>
        </button>
        <!-- Mobile Nav (injectat per scripts.js) -->
        <div id="app-mobile-nav"></div>
    </div>
</body>

</html>

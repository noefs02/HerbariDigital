<!DOCTYPE html>
<html class="dark" lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Catàleg científic i visual de la flora autòctona i endemismes de l'arxipèlag balear">
    <title>Herbario Balear</title>

    <link rel="icon" type="image/svg+xml" href="media/img/logo.svg">

    <link rel="stylesheet" href="css/output.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" media="print"
        onload="this.media='all'">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" media="print"
        onload="this.media='all'" />

    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
            rel="stylesheet" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    </noscript>

    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/app.js"></script>
</head>

<body class="bg-background-dark font-display text-slate-300 transition-colors duration-200">
    <a href="#app-content"
        class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-amber-600 focus:text-white focus:rounded-lg focus:outline-none">
        Saltar al contingut principal
    </a>
    
    <div id="app-wrapper" class="relative flex min-h-screen w-full flex-col">
        <header id="app-header" role="banner"></header>

        <div class="layout-container flex-1 flex flex-col w-full">
            <main id="app-content" class="flex-1 flex flex-col w-full relative" tabindex="-1"></main>
        </div>

        <footer id="app-footer" role="contentinfo"></footer>
    </div>

            <!-- Modal de Autenticación (Login) - Fuera de app-wrapper para evitar colisiones de backdrop-filter -->
            <div id="auth-modal"
                class="fixed inset-0 z-[200] hidden flex items-center justify-center bg-black/60 backdrop-blur-sm px-2 sm:px-4">
                <div
                    class="bg-surface border border-white/10 rounded-2xl p-4 sm:p-6 w-full max-w-sm shadow-2xl shadow-black">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold flex items-center gap-2 text-white">
                            <span class="material-symbols-outlined text-primary">account_circle</span>
                            Iniciar Sessió / Registre
                        </h2>
                        <button id="btn-close-modal" class="text-slate-400 hover:text-white transition-colors">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                    <p class="text-sm text-slate-400 mb-4">Introdueix un nom d'usuari. Si no existeix, es crearà
                        automàticament el compte.</p>
                    <form id="auth-form" class="space-y-4">
                        <div>
                            <input type="text" id="auth-username" required
                                class="w-full bg-slate-900 border border-white/10 rounded-lg px-4 py-2.5 text-base sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                                placeholder="Nom d'usuari...">
                        </div>
                        <button type="submit"
                            class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-2.5 rounded-lg transition-colors shadow-lg shadow-primary/20">
                            Entrar a l'Herbari
                        </button>
                    </form>
                </div>
            </div>
</body>

</html>
